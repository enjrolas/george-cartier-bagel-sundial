<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>George Cartier Bagel Sundial</title>
  <meta name="description" content="The Monument George-Étienne Cartier as a giant sundial: cast its shadow for any date/time and see which Montréal bagel shop the bearing points at." />

  <link rel="stylesheet" href="css/style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◵</span>
      <div class="brand-text">
        <h1>George Cartier Bagel Sundial</h1>
        <p>Where the monument's shadow points</p>
      </div>
    </div>
    <div class="topbar-right">
      <a class="ar-link" href="/ar/">◎ AR</a>
      <a class="ar-link" href="/watch/">⌚ watch</a>
      <div class="loc-readout" id="locReadout">45.5142&deg;N, 73.5852&deg;W &middot; Montréal</div>
    </div>
  </header>

  <main class="stage">
    <div id="scene" class="scene"></div>
    <div class="scene-tools">
      <button class="btn" id="viewCity" type="button">City view</button>
      <button class="btn" id="viewStatue" type="button">Zoom to statue</button>
    </div>
    <div class="viewer-legend">
      <span class="lg lg-tip">shadow tip</span>
      <span class="lg lg-beam">points to bagel</span>
      <span class="lg lg-mon">monument</span>
    </div>
    <div id="viewerNote" class="viewer-note" hidden></div>
  </main>

  <section class="controls">
    <div class="ctl-group">
      <label class="ctl">
        <span class="ctl-title">Date</span>
        <input type="date" id="date" />
      </label>
      <button id="nowBtn" class="btn" type="button">Now</button>
    </div>
    <div class="ctl-group">
      <label class="ctl ctl-slider">
        <span class="ctl-title">Time <em id="timeVal">—</em> <em id="tzLabel">(local)</em></span>
        <input type="range" id="timeSlider" min="0" max="1439" step="1" value="780" />
        <span class="ctl-hint">scrub through the day to sweep the shadow</span>
      </label>
    </div>
  </section>

  <section class="readouts" id="readouts">
    <div class="ro"><span class="ro-k">Sun</span><span class="ro-v" id="roSun">—</span></div>
    <div class="ro"><span class="ro-k">Shadow bearing</span><span class="ro-v" id="roBearing">—</span></div>
    <div class="ro"><span class="ro-k">Shadow length</span><span class="ro-v" id="roTip">—</span></div>
    <div class="ro"><span class="ro-k">Alignment</span><span class="ro-v" id="roOffset">—</span></div>
    <div class="ro ro-wide"><span class="ro-k">Points to (bagel)</span><span class="ro-v" id="roPlace">—</span></div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
