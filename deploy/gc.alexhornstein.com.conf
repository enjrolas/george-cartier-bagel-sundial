<VirtualHost *:80>
	ServerName gc.alexhornstein.com
	ServerAdmin alex@alexhornstein.com

	DocumentRoot /home/japhy/gc.alexhornstein.com

	<Directory /home/japhy/gc.alexhornstein.com>
		Require all granted
		Options Indexes FollowSymLinks
		AllowOverride Limit Options FileInfo
		DirectoryIndex index.html
	</Directory>

	# large photogrammetry assets — let the browser cache them
	<FilesMatch "\.(obj|mtl|jpg|jpeg|png)$">
		Header set Cache-Control "public, max-age=604800"
	</FilesMatch>

	LogLevel info
	ErrorLog /home/japhy/logs/gc.alexhornstein.com-error.log
	CustomLog /home/japhy/logs/gc.alexhornstein.com-access.log combined
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
